# TrainTicketing 本地 RocketMQ broker 配置（挂载进 tt-rocketmq-broker 容器）
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0

# namesrv 地址走 compose 服务名
namesrvAddr = tt-rocketmq-namesrv:9876

# 关键：对客户端通告的地址必须是容器网络内可解析的名字。
# compose 默认网络中 Docker DNS 解析服务名，容器内 business 用它回连 broker；
# 宿主机进程不直连 broker（宿主观察走 18080 控制台）
brokerIP1 = tt-rocketmq-broker
listenPort = 10911

# 本地学习环境：自动建 topic（生产环境应关闭、提前规划 topic）
autoCreateTopicEnable = true
autoCreateSubscriptionGroupEnable = true

# 主从与刷盘：单机异步即可
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
deleteWhen = 04
fileReservedTime = 48
