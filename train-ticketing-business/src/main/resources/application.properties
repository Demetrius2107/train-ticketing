server.port=8002
#方便路由转发
server.servlet.context-path=/business
spring.application.name=train-ticketing-business

#数据库连接（本地开发指向 docker compose 的 mysql，宿主机端口 13306，避免占用/冲突本机 3306）
spring.datasource.url=jdbc:mysql://localhost:13306/train_ticketing?characterEncoding=UTF8&autoReconnect=true&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#连接池（压测实测：默认10连接在查询压力下 pending 排到 189，扩容消除等连接排队；
#获取连接 5s 超时快速失败，宁可拒绝也不无限堆积）
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=5000
#mybatis xml 路径
mybatis.mapper-locations=classpath:/mapper/**/*.xml
logging.level.com.trainticketing.business.mapper=trace

#Redis 连接（余票缓存 + Lua 预扣；本地/容器 Redis 均免密，勿写空的 password 行，空串会让 Redisson 发起 AUTH）
spring.data.redis.host=localhost
spring.data.redis.port=6379

#RocketMQ（阶段2 削峰 + 延时关单；本地开发连 docker compose 的 namesrv，宿主机映射 9876）
rocketmq.name-server=localhost:9876
rocketmq.producer.group=ticket-order-producer-group
rocketmq.producer.send-message-timeout=3000
rocketmq.producer.retry-times-when-send-failed=2
#订单 MQ 业务配置：topic 与关单延时等级（RocketMQ 4.x 固定 18 级，14=10min 对齐订单支付过期时间；
#本地演示延时关单可临时改 5=1min）
ticket.order.create-topic=tt-order-create-topic
ticket.order.close-topic=tt-order-close-topic
ticket.order.close-delay-level=14

#监控指标（compose.monitoring.yml 的 Prometheus 抓取；直连端口访问，不经网关）
management.endpoints.web.exposure.include=health,prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true
