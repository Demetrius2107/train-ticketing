server.port=8002
#方便路由转发
server.servlet.context-path=/business
spring.application.name=train-ticketing-business

#数据库连接
spring.datasource.url=jdbc:mysql://localhost:3306/train_ticketing?characterEncoding=UTF8&autoReconnect=true&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#mybatis xml 路径
mybatis.mapper-locations=classpath:/mapper/**/*.xml
logging.level.com.trainticketing.business.mapper=trace

#Redis 连接（余票缓存 + Lua 预扣）
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
