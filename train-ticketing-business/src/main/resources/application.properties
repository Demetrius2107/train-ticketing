server.port=8002
#方便路由转发
server.servlet.context-path=/business
spring.application.name=train-ticketing-business

#数据库连接（本地开发指向 docker compose 的 mysql，宿主机端口 13306，避免占用/冲突本机 3306）
spring.datasource.url=jdbc:mysql://localhost:13306/train_ticketing?characterEncoding=UTF8&autoReconnect=true&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#mybatis xml 路径
mybatis.mapper-locations=classpath:/mapper/**/*.xml
logging.level.com.trainticketing.business.mapper=trace

#Redis 连接（余票缓存 + Lua 预扣；本地/容器 Redis 均免密，勿写空的 password 行，空串会让 Redisson 发起 AUTH）
spring.data.redis.host=localhost
spring.data.redis.port=6379

#监控指标（compose.monitoring.yml 的 Prometheus 抓取；直连端口访问，不经网关）
management.endpoints.web.exposure.include=health,prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true
