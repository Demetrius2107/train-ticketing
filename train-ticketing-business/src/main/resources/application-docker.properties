# Docker 容器内专属覆盖（compose 里通过 SPRING_PROFILES_ACTIVE=docker 激活）
# 数据库/Redis 指向 compose 服务名；账号密码与 application.properties 一致不再重复
spring.datasource.url=jdbc:mysql://tt-mysql:3306/train_ticketing?characterEncoding=UTF8&autoReconnect=true&serverTimezone=Asia/Shanghai
spring.data.redis.host=tt-redis
spring.data.redis.port=6379

# 容器内关闭 mapper TRACE 行级日志（压测/运行时 I/O 大头；本地开发保持 application.properties 的 trace 便于调试）
logging.level.com.trainticketing.business.mapper=info

# RocketMQ namesrv 指向 compose 服务名（其余 MQ 配置与 application.properties 一致）
rocketmq.name-server=tt-rocketmq-namesrv:9876
