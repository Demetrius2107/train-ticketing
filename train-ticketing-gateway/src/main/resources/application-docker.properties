# Docker 容器内专属覆盖（compose 里通过 SPRING_PROFILES_ACTIVE=docker 激活）
# 注意：Spring Boot 的 List 属性跨配置源不合并——高优先级源出现 routes[n] 后整个列表以它为准，
# 因此这里必须把两条路由写全（uri 指向 compose 服务名），不能只覆盖 uri
spring.cloud.gateway.routes[0].id=member
spring.cloud.gateway.routes[0].uri=http://tt-member:8001
spring.cloud.gateway.routes[0].predicates[0]=Path=/member/**

spring.cloud.gateway.routes[1].id=business
spring.cloud.gateway.routes[1].uri=http://tt-business:8002
spring.cloud.gateway.routes[1].predicates[0]=Path=/business/**
