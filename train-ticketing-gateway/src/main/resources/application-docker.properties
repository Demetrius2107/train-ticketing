# Docker 容器内专属覆盖（compose 里通过 SPRING_PROFILES_ACTIVE=docker 激活）
# 注意：Spring Boot 的 List 属性跨配置源不合并——高优先级源出现 routes[n] 后整个列表以它为准，
# 因此这里必须把三条路由写全（uri 指向 compose 服务名），不能只覆盖 uri
spring.cloud.gateway.routes[0].id=member
spring.cloud.gateway.routes[0].uri=http://tt-member:8001
spring.cloud.gateway.routes[0].predicates[0]=Path=/member/**

# 下单链路独立路由：Redis 令牌桶限流（默认每会员 20/s、突发 40），置于通配 business 路由之前
spring.cloud.gateway.routes[1].id=order
spring.cloud.gateway.routes[1].uri=http://tt-business:8002
spring.cloud.gateway.routes[1].predicates[0]=Path=/business/order/**
spring.cloud.gateway.routes[1].filters[0].name=RequestRateLimiter
spring.cloud.gateway.routes[1].filters[0].args.replenishRate=20
spring.cloud.gateway.routes[1].filters[0].args.burstCapacity=40
spring.cloud.gateway.routes[1].filters[0].args.key-resolver=#{@memberKeyResolver}

spring.cloud.gateway.routes[2].id=business
spring.cloud.gateway.routes[2].uri=http://tt-business:8002
spring.cloud.gateway.routes[2].predicates[0]=Path=/business/**

#Redis（RequestRateLimiter 令牌桶存储，compose 网络内服务名）
spring.data.redis.host=tt-redis
spring.data.redis.port=6379

#监控指标（Prometheus 抓取：网关 QPS/状态码分布，观察限流 429）
management.endpoints.web.exposure.include=health,prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true
logging.pattern.level=%5p [%X{traceId:-}]
