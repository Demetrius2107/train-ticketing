server.port=8000

spring.cloud.gateway.routes[0].id=member
spring.cloud.gateway.routes[0].uri=http://127.0.0.1:8001
#spring.cloud.gateway.routes[0].uri=lb://127.0.0.1:8001
spring.cloud.gateway.routes[0].predicates[0]=Path=/member/**

# 下单链路独立路由：Redis 令牌桶限流（默认每会员 20/s、突发 40，压测/生产可调），
# 须置于通配 business 路由之前才会命中
spring.cloud.gateway.routes[1].id=order
spring.cloud.gateway.routes[1].uri=http://127.0.0.1:8002
spring.cloud.gateway.routes[1].predicates[0]=Path=/business/order/**
spring.cloud.gateway.routes[1].filters[0].name=RequestRateLimiter
spring.cloud.gateway.routes[1].filters[0].args.replenishRate=20
spring.cloud.gateway.routes[1].filters[0].args.burstCapacity=40
spring.cloud.gateway.routes[1].filters[0].args.key-resolver=#{@memberKeyResolver}

spring.cloud.gateway.routes[2].id=business
spring.cloud.gateway.routes[2].uri=http://127.0.0.1:8002
spring.cloud.gateway.routes[2].predicates[0]=Path=/business/**

#Redis（RequestRateLimiter 令牌桶存储，与 member/business 共用 compose 的 redis）
spring.data.redis.host=localhost
spring.data.redis.port=6379

#
jwt.secret=trainticketing-dev-secret-key-please-change-in-prod-32bytes

#监控指标（Prometheus 抓取：网关 QPS/状态码分布，观察限流 429）
management.endpoints.web.exposure.include=health,prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true
#网关日志带 traceId（TraceIdFilter 写入 MDC）
logging.pattern.level=%5p [%X{traceId:-}]
