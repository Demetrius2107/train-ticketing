# TrainTicketing 本地环境：MySQL 8 + Redis 7 + RocketMQ 4.9.4 + 后端三服务（gateway/member/business）
# MySQL 宿主机映射独立端口 13306，避免与本机自装 MySQL（3306）互相冲突；
# 容器网络内部仍是 3306，应用容器走服务名 tt-mysql:3306 不受影响
#
# 只跑集成/并发测试（如 OrderConcurrencyTest）：仅需 mysql + redis
#   docker compose up -d mysql redis
#
# 起全套后端（网关 8000 / 会员 8001 / 业务 8002 / namesrv 9876 / broker 10911）：
#   1) mvn -DskipTests package        # 先打包出各模块 target/*.jar（gateway 依赖 common，根目录整包）
#   2) docker compose up -d
#
# 连监控一起起（Prometheus 9090 / Grafana 3000 admin=admin / cAdvisor 8888 / RocketMQ 控制台 18080）：
#   docker compose --profile monitoring up -d
#   应用指标来自 member/business 的 actuator（依赖已加），面板自动预置（monitoring/grafana/）
#
# RocketMQ 说明：broker 的 brokerIP1 配成 compose 服务名 tt-rocketmq-broker，
# 容器内客户端经 Docker DNS 解析回连；宿主机进程不直连 broker（宿主调试用 18080 控制台看即可）。
#
# 首次启动 MySQL 会自动执行 script/sql/train-ticketing.sql 建库建表（仅空数据卷时执行一次）
# 前端 web 暂未容器化：仍为脚手架，本地 cd web && npm run dev（9000）
services:
  mysql:
    image: mysql:8.0
    container_name: tt-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: train_ticketing
      TZ: Asia/Shanghai
    ports:
      - "13306:3306"
    volumes:
      - ./script/sql/train-ticketing.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - tt-mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: tt-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  # ======== RocketMQ（阶段2 削峰 + 延时关单）========
  rocketmq-namesrv:
    image: apache/rocketmq:4.9.4
    container_name: tt-rocketmq-namesrv
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      # namesrv 很轻，限制 JVM 防止吃满笔记本内存
      JAVA_OPT_EXT: "-Xms256m -Xmx256m"
    command: ["sh", "mqnamesrv"]
    ports:
      - "9876:9876"
    healthcheck:
      test: ["CMD", "sh", "mqadmin", "clusterList", "-n", "localhost:9876"]
      interval: 10s
      timeout: 10s
      retries: 30

  rocketmq-broker:
    image: apache/rocketmq:4.9.4
    container_name: tt-rocketmq-broker
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      JAVA_OPT_EXT: "-Xms512m -Xmx512m -Xmn256m"
    command: ["sh", "mqbroker", "-c", "/home/rocketmq/broker.conf"]
    volumes:
      - ./rocketmq/broker.conf:/home/rocketmq/broker.conf:ro
    # 注意：不要给 /home/rocketmq/store、/logs 挂具名卷——镜像中不存在该目录时卷会创建成 root 属主，
    # broker（uid 3000）无写权限直接退出 253（且日志写在 logs 目录，docker logs 也是空的）。
    # 本地学习环境 broker 数据写入容器层即可（重启丢消息无影响，防超卖正确性不依赖消息持久化）；
    # 10911/10909/10912 不发布宿主机：客户端全在容器网络内（brokerIP1=服务名回连），
    # 避免与宿主机端口冲突；宿主侧观察走 monitoring profile 的 RocketMQ 控制台
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy

  member:
    build: ./train-ticketing-member
    container_name: tt-member
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      # 容器内差异配置（DB/Redis 地址）走各模块 application-docker.properties；
      # 不用环境变量覆盖：索引属性（如 gateway routes[n].uri）无法局部覆盖，空 password 会触发 Redisson AUTH
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8001:8001"
    depends_on:
      mysql:
        condition: service_healthy

  business:
    build: ./train-ticketing-business
    container_name: tt-business
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8002:8002"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rocketmq-namesrv:
        condition: service_healthy

  gateway:
    build: ./train-ticketing-gateway
    container_name: tt-gateway
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8000:8000"
    depends_on:
      - member
      - business

  # ======== 监控三件套（默认不启动，--profile monitoring 启用）========
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: tt-prometheus
    profiles: [ "monitoring" ]
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - tt-prometheus-data:/prometheus
    depends_on:
      - cadvisor

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: tt-cadvisor
    profiles: [ "monitoring" ]
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    ports:
      - "8888:8080"

  grafana:
    image: grafana/grafana:10.0.3
    container_name: tt-grafana
    profiles: [ "monitoring" ]
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - tt-grafana-data:/var/lib/grafana

  # RocketMQ 控制台（观察 topic/堆积/消费进度，宿主 18080）
  rocketmq-dashboard:
    image: apacherocketmq/rocketmq-dashboard:1.0.0
    container_name: tt-rocketmq-dashboard
    profiles: [ "monitoring" ]
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: "-Drocketmq.namesrv.addr=tt-rocketmq-namesrv:9876 -Xms256m -Xmx256m"
    ports:
      - "18080:8080"
    depends_on:
      - rocketmq-namesrv

volumes:
  tt-mysql-data:
  tt-prometheus-data:
  tt-grafana-data:
