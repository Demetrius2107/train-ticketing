# Docker 容器内专属覆盖（compose 里通过 SPRING_PROFILES_ACTIVE=docker 激活）
# 数据库连接指向 compose 服务名 tt-mysql；账号密码与 application.properties 一致不再重复
spring.datasource.url=jdbc:mysql://tt-mysql:3306/train_ticketing?characterEncoding=UTF8&autoReconnect=true&serverTimezone=Asia/Shanghai
# 占位短信通道开发模式：send-code 响应直返验证码，联调脚本一键拿码（生产严禁开启）
member.sms.mock-return-code=true
# 开发快捷登录：跳过验证码、手机号不存在自动注册，前端页面联调直接进（生产严禁开启）
member.login.skip-code=true
