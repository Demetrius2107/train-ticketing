server.port=8001
#方便路由转发
server.servlet.context-path=/member
spring.application.name=member

#数据库连接
spring.datasource.url=jdbc:mysql://localhost:3306/train_ticketing?characterEncoding=UTF8&autoReconnect=true&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#mybatis xml 路径
mybatis.mapper-locations=classpath:/mapper/**/*.xml
logging.level.com.trainticketing.member.mapper=trace

#JWT 签发（与 gateway 共用同一密钥，HS256 对称签名）
jwt.secret=trainticketing-dev-secret-key-please-change-in-prod-32bytes
jwt.expire-hours=2
